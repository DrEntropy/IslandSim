[project]
name = "islandsim"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dotenv>=0.9.9",
    "jupyter>=1.1.1",
    "langfuse>=4.0.1",
    "openai>=2.29.0",
    "openrouter>=0.7.11",
    "pydantic-ai>=1.70.0",
    "pyyaml>=6.0",
    "rich>=13.0",
    "textual>=0.80",
]

[project.scripts]
islandsim-log = "islandsim.log_reader:main"

[build-system]
requires = ["uv_build>=0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""

[project]
name = "islandsim"
version = "0.1.0"
description = "Multi-agent tabletop exercise simulator for island-nation crisis negotiation"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = [
    "jupyter>=1.1.1",
    "langfuse>=4.0.1",
    "openai>=2.29.0",
    "openrouter>=0.7.11",
    "pydantic-ai>=1.70.0",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0",
    "rich>=13.0",
    "textual>=0.80",
]

[project.scripts]
islandsim-log = "islandsim.log_reader:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["uv_build>=0.9"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
